name: Close stale "needs more info" issues

# Maintainers add "needs more info" by hand; nothing is marked automatically. Closes 7 days later with no reply.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@v9
        with:
          only-issue-labels: "needs more info"
          stale-issue-label: "needs more info"
          days-before-issue-stale: -1
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-issue-stale-when-updated: true
          close-issue-reason: not_planned
          close-issue-message: >-
            Closing: no reply in 7 days after we asked for more information.
            Comment with the missing details and we'll reopen it.
